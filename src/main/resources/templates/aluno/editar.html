<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
  <div class="page-header">
    <div class="page-header-left"><h1>Editar Aluno</h1></div>
    <div class="page-actions"><a th:href="@{/alunos}" class="btn btn-ghost"><i class="fas fa-arrow-left"></i> Voltar</a></div>
  </div>
  <div class="card" style="max-width:560px">
    <div class="card-body">
      <form th:action="@{/alunos/{id}/editar(id=${aluno.id})}" method="post">
        <div class="form-group" style="margin-bottom:16px">
          <label>Nome completo *</label>
          <input type="text" name="nome" required th:value="${aluno.nome}"/>
        </div>
        <div class="form-group" style="margin-bottom:20px">
          <label>E-mail *</label>
          <input type="email" name="email" required th:value="${aluno.email}"/>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">
          <i class="fas fa-save"></i> Salvar Alterações
        </button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
