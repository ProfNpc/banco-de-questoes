<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
  <div class="page-header">
    <div class="page-header-left"><h1>Novo Aluno</h1></div>
    <div class="page-actions"><a th:href="@{/alunos}" class="btn btn-ghost"><i class="fas fa-arrow-left"></i> Voltar</a></div>
  </div>
  <div class="card" style="max-width:560px">
    <div class="card-body">
      <form th:action="@{/alunos/novo}" method="post">
        <div class="form-group" style="margin-bottom:16px">
          <label>Nome completo *</label>
          <input type="text" name="nome" required placeholder="Ex: João da Silva"/>
        </div>
        <div class="form-group" style="margin-bottom:16px">
          <label>E-mail *</label>
          <input type="email" name="email" required placeholder="aluno@escola.edu.br"/>
        </div>
        <div class="form-group" style="margin-bottom:20px">
          <label>Senha inicial *</label>
          <div style="display:flex;gap:8px">
            <input type="text" name="senha" id="senhaInput" required
                   th:value="${senhaSugerida}" style="flex:1;font-family:var(--font-mono)"/>
            <button type="button" class="btn btn-ghost" onclick="gerarSenha()" title="Gerar nova senha">
              <i class="fas fa-sync"></i>
            </button>
          </div>
          <p class="form-hint">O aluno deverá trocar esta senha no primeiro acesso.</p>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">
          <i class="fas fa-save"></i> Criar Aluno
        </button>
      </form>
    </div>
  </div>
</div>
<th:block layout:fragment="scripts">
<script>
const CHARS='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
function gerarSenha(){let s='';for(let i=0;i<5;i++)s+=CHARS[Math.floor(Math.random()*CHARS.length)];document.getElementById('senhaInput').value=s;}
</script>
</th:block>
</body>
</html>
