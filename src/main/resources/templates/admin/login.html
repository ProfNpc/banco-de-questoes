<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | QuestionBase</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    /* Grade decorativa de fundo */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(91,76,255,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(91,76,255,.06) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
    .login-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 24px;
    }
    .login-card {
      background: var(--white);
      border-radius: 20px;
      padding: 44px 40px;
      box-shadow: 0 32px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.08);
    }
    .login-logo {
      text-align: center;
      margin-bottom: 36px;
    }
    .login-logo .icon {
      font-size: 2.8rem;
      color: var(--accent);
      display: block;
      margin-bottom: 10px;
    }
    .login-logo h1 {
      font-family: var(--font-serif);
      font-size: 1.7rem;
      font-weight: 400;
      color: var(--ink);
      margin-bottom: 4px;
    }
    .login-logo p {
      font-size: .8rem;
      color: var(--muted);
      font-family: var(--font-mono);
    }
    .field-label {
      display: block;
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--slate);
      margin-bottom: 6px;
    }
    .field-input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      font-family: var(--font-sans);
      font-size: .95rem;
      color: var(--ink);
      background: var(--bg);
      transition: border-color .15s, box-shadow .15s;
      margin-bottom: 18px;
    }
    .field-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(91,76,255,.12);
    }
    .login-btn {
      width: 100%;
      padding: 13px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-family: var(--font-sans);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, transform .1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 4px;
    }
    .login-btn:hover { background: var(--accent-2); transform: translateY(-1px); }
    .login-btn:active { transform: translateY(0); }
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: var(--muted);
      font-size: .75rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--line);
    }
    .portal-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px;
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      text-decoration: none;
      color: var(--slate);
      font-size: .875rem;
      font-weight: 500;
      transition: all .15s;
    }
    .portal-link:hover { border-color: var(--success); color: var(--success); background: var(--success-light); }
    .badge-admin {
      position: absolute;
      top: 16px;
      right: 16px;
      background: var(--accent-light);
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: .65rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      letter-spacing: .5px;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card" style="position:relative">
      <span class="badge-admin">PAINEL ADMIN</span>

      <div class="login-logo">
        <span class="icon">◈</span>
        <h1>QuestionBase</h1>
        <p>Acesso restrito ao professor</p>
      </div>

      <!-- Alerta de erro -->
      <div th:if="${erro}"
           style="background:var(--danger-light);color:#991b1b;border-radius:var(--radius);
                  padding:10px 14px;margin-bottom:20px;font-size:.875rem;display:flex;gap:8px;align-items:center">
        <i class="fas fa-exclamation-circle"></i>
        <span th:text="${erro}"></span>
      </div>

      <form th:action="@{/admin/login}" method="post">
        <label class="field-label">E-mail</label>
        <input type="email" name="email" class="field-input" required
               placeholder="professor@escola.edu.br" autofocus/>

        <label class="field-label">Senha</label>
        <input type="password" name="senha" class="field-input" required
               placeholder="••••••••"/>

        <button type="submit" class="login-btn">
          <i class="fas fa-sign-in-alt"></i> Entrar no Painel
        </button>
      </form>

      <div class="divider">ou</div>

      <a th:href="@{/prova/fazer}" class="portal-link">
        <i class="fas fa-play-circle"></i>
        Ir para o Portal do Aluno
      </a>
    </div>
  </div>
</body>
</html>
