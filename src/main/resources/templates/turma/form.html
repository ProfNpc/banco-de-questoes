<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
  <div class="page-header">
    <div class="page-header-left">
      <h1 th:text="${turma != null} ? 'Editar Turma' : 'Nova Turma'"></h1>
    </div>
    <div class="page-actions">
      <a th:href="${turma != null} ? '/turmas/' + ${turma.id} : '/turmas'" class="btn btn-ghost">
        <i class="fas fa-arrow-left"></i> Voltar
      </a>
    </div>
  </div>
  <div class="card" style="max-width:560px">
    <div class="card-body">
      <form th:action="${turma != null} ? '/turmas/' + ${turma.id} + '/editar' : '/turmas/nova'" method="post">
        <div class="form-group" style="margin-bottom:16px">
          <label>Nome da Turma *</label>
          <input type="text" name="nome" required
                 th:value="${turma?.nome}" placeholder="Ex: Turma A — Informática 2024"/>
        </div>
        <div class="form-group" style="margin-bottom:20px">
          <label>Descrição</label>
          <textarea name="descricao" rows="4"
                    style="width:100%;padding:10px;border:1.5px solid var(--line);border-radius:var(--radius);font-family:var(--font-sans)"
                    placeholder="Descrição opcional da turma..."
                    th:text="${turma?.descricao}"></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">
          <i class="fas fa-save"></i>
          <span th:text="${turma != null} ? 'Salvar Alterações' : 'Criar Turma'"></span>
        </button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
