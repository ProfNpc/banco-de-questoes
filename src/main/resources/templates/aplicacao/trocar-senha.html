<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Criar Nova Senha | QuestionBase</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link rel="stylesheet" th:href="@{/css/app.css}"/>
<style>body{background:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100vh;}.card-login{background:var(--white);border-radius:20px;padding:40px;width:100%;max-width:420px;box-shadow:0 24px 80px rgba(0,0,0,.4);}</style>
</head>
<body>
<div class="card-login">
  <div style="text-align:center;margin-bottom:28px">
    <i class="fas fa-key" style="font-size:2.5rem;color:var(--warning);display:block;margin-bottom:8px"></i>
    <h1 style="font-family:var(--font-serif);font-size:1.5rem;font-weight:400">Criar nova senha</h1>
    <p style="color:var(--muted);font-size:.875rem">Este é seu primeiro acesso. Defina uma senha pessoal.</p>
  </div>
  <div th:if="${erro}" class="alert alert-error" style="margin-bottom:16px">
    <i class="fas fa-exclamation-circle"></i><span th:text="${erro}"></span>
  </div>
  <form th:action="@{/prova/trocar-senha}" method="post">
    <div class="form-group" style="margin-bottom:14px">
      <label style="font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase">Nova Senha *</label>
      <input type="password" name="novaSenha" required minlength="4"
             style="width:100%;padding:12px;border:1.5px solid var(--line);border-radius:var(--radius);font-size:.95rem;box-sizing:border-box"
             placeholder="Mínimo 4 caracteres"/>
    </div>
    <div class="form-group" style="margin-bottom:20px">
      <label style="font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase">Confirmar Senha *</label>
      <input type="password" name="confirmarSenha" required minlength="4"
             style="width:100%;padding:12px;border:1.5px solid var(--line);border-radius:var(--radius);font-size:.95rem;box-sizing:border-box"
             placeholder="Repita a senha"/>
    </div>
    <button type="submit" style="width:100%;padding:13px;background:var(--accent);color:white;border:none;border-radius:var(--radius);font-size:1rem;font-weight:700;cursor:pointer">
      <i class="fas fa-check"></i> Definir Senha e Entrar
    </button>
  </form>
</div>
</body>
</html>
