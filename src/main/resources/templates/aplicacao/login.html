<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portal de Provas | QuestionBase</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: #0d1117;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: var(--white);
      border-radius: 20px;
      padding: 44px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 32px 80px rgba(0,0,0,.5);
      margin: 24px;
    }
    .logo { text-align: center; margin-bottom: 36px; }
    .logo .icon { font-size: 2.5rem; color: var(--success); display: block; margin-bottom: 8px; }
    .logo h1 { font-family: var(--font-serif); font-size: 1.6rem; font-weight: 400; color: var(--ink); }
    .logo p { font-size: .8rem; color: var(--muted); margin-top: 4px; }
    .field-label { display: block; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--slate); margin-bottom: 6px; }
    .field-input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: var(--radius); font-family: var(--font-sans); font-size: .95rem; color: var(--ink); background: var(--bg); margin-bottom: 16px; transition: border-color .15s; }
    .field-input:focus { outline: none; border-color: var(--success); box-shadow: 0 0 0 3px rgba(34,197,94,.12); }
    .login-btn { width: 100%; padding: 13px; background: var(--success); color: white; border: none; border-radius: var(--radius); font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 4px; transition: background .15s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .login-btn:hover { background: #16a34a; }
    .footer-link { text-align: center; margin-top: 24px; font-size: .8rem; }
    .footer-link a { color: var(--muted); text-decoration: none; }
    .footer-link a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <span class="icon"><i class="fas fa-play-circle"></i></span>
      <h1>Portal de Provas</h1>
      <p>Entre com e-mail e senha para acessar suas provas</p>
    </div>

    <div th:if="${erro}"
         style="background:var(--danger-light);color:#991b1b;border-radius:var(--radius);padding:10px 14px;margin-bottom:18px;font-size:.875rem;display:flex;gap:8px;align-items:center">
      <i class="fas fa-exclamation-circle"></i>
      <span th:text="${erro}"></span>
    </div>
    <div th:if="${sucesso}"
         style="background:var(--success-light);color:#166534;border-radius:var(--radius);padding:10px 14px;margin-bottom:18px;font-size:.875rem;display:flex;gap:8px;align-items:center">
      <i class="fas fa-check-circle"></i>
      <span th:text="${sucesso}"></span>
    </div>

    <form th:action="@{/prova/fazer}" method="post">
      <label class="field-label">E-mail</label>
      <input type="email" name="email" class="field-input" required placeholder="seu@email.com" autofocus/>
      <label class="field-label">Senha</label>
      <input type="password" name="senha" class="field-input" required placeholder="••••••"/>
      <button type="submit" class="login-btn">
        <i class="fas fa-sign-in-alt"></i> Entrar
      </button>
    </form>

    <div class="footer-link">
      <a th:href="@{/admin/login}"><i class="fas fa-lock"></i> Acesso do professor ao painel</a>
    </div>
  </div>
</body>
</html>
