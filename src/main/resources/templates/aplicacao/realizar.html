<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${pageTitle}">Prova</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <style>
    body { background: var(--bg-2); }
    .prova-header { background: var(--white); border-bottom: 2px solid var(--line); padding: 12px 24px; position: sticky; top: 0; z-index: 100; display: flex; align-items: center; gap: 16px; }
    .timer { font-family: var(--font-mono); font-size: 1.4rem; font-weight: 700; min-width: 80px; text-align: center; padding: 6px 14px; border-radius: 8px; background: var(--ink-2); color: #e8e8f0; }
    .timer.urgente { background: var(--danger-light); color: var(--danger); animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
    .questao-nav { display: flex; gap: 6px; flex-wrap: wrap; }
    .q-btn { width: 34px; height: 34px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--white); font-size: .8rem; font-weight: 700; cursor: pointer; transition: all .15s; text-decoration: none; display: flex; align-items: center; justify-content: center; color: var(--slate); }
    .q-btn.respondida { background: var(--success-light); border-color: var(--success); color: #166534; }
    .q-btn.atual { background: var(--accent); border-color: var(--accent); color: white; }
    .alt-opcao { display: flex; align-items: flex-start; gap: 12px; padding: 14px 18px; border: 2px solid var(--line); border-radius: var(--radius); margin-bottom: 10px; cursor: pointer; transition: all .15s; }
    .alt-opcao:hover { border-color: var(--accent); background: var(--accent-light); }
    .alt-opcao.selecionada { border-color: var(--accent); background: var(--accent-light); }
    .alt-opcao input[type="radio"] { margin-top: 2px; accent-color: var(--accent); }
    .progresso-bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 20px; }
    .progresso-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s; }
  </style>
</head>
<body>

<!-- Header fixo com temporizador -->
<div class="prova-header">
  <div style="flex:1">
    <div style="font-weight:700;font-size:.95rem" th:text="${ap.prova.titulo}">Prova</div>
    <div style="font-size:.75rem;color:var(--muted)">
      Questão <strong th:text="${questaoIdx + 1}"></strong> de <strong th:text="${totalQuestoes}"></strong>
    </div>
  </div>

  <!-- Timer regressivo -->
  <div class="timer" id="timer">--:--</div>

  <!-- Botão encerrar -->
  <form th:action="@{/prova/realizar/{id}/encerrar(id=${ap.id})}" method="post"
        onsubmit="return confirm('Encerrar a prova agora? Você não poderá mais responder.')">
    <button type="submit" class="btn btn-danger btn-sm">
      <i class="fas fa-flag-checkered"></i> Encerrar
    </button>
  </form>
</div>

<main style="max-width:820px;margin:0 auto;padding:28px 24px">

  <!-- Barra de progresso -->
  <div class="progresso-bar">
    <div class="progresso-fill"
         th:style="'width:' + ${(respostas.size() * 100 / totalQuestoes)} + '%'"></div>
  </div>

  <!-- Navegação entre questões -->
  <div class="card" style="margin-bottom:20px">
    <div class="card-body" style="padding:12px 16px">
      <div style="font-size:.75rem;color:var(--muted);margin-bottom:8px;font-weight:700;text-transform:uppercase">Navegação rápida</div>
      <div class="questao-nav" th:with="respondidas=${respostas.stream().map(r -> r.questao.id).toList()}">
        <a th:each="qNav, iter : ${ap.prova.provaQuestoes}"
           th:href="@{/prova/realizar/{id}(id=${ap.id},questao=${iter.index})}"
           th:class="'q-btn' + (${iter.index == questaoIdx} ? ' atual' : (${respondidas.contains(qNav.questao.id)} ? ' respondida' : ''))"
           th:text="${iter.count}"></a>
      </div>
      <div style="font-size:.73rem;color:var(--muted);margin-top:8px">
        <span style="color:var(--success)">■</span> Respondida
        <span style="color:var(--accent);margin-left:10px">■</span> Atual
        <span style="color:var(--muted);margin-left:10px">■</span> Não respondida
      </div>
    </div>
  </div>

  <!-- Questão atual -->
  <div class="card">
    <div class="card-header">
      <span class="card-title" th:text="'Questão ' + (${questaoIdx + 1})"></span>
      <span class="badge badge-neutral" th:text="${pq.questao.tipo.descricao}"></span>
    </div>
    <div class="card-body">
      <!-- Enunciado -->
      <div class="markdown-body" style="margin-bottom:24px"
           th:utext="${@markdownService.renderizar(pq.questao.enunciado)}"></div>

      <!-- Formulário de resposta -->
      <form th:action="@{/prova/realizar/{id}/responder(id=${ap.id})}" method="post">
        <input type="hidden" name="questaoId" th:value="${pq.questao.id}"/>
        <input type="hidden" name="proximaQuestao"
               th:value="${questaoIdx + 1 < totalQuestoes ? questaoIdx + 1 : questaoIdx}"/>

        <div th:if="${pq.questao.tipo.name() == 'OBJETIVA'}">
          <div th:each="alt : ${pq.questao.alternativas}"
               th:class="'alt-opcao' + (${alt.id == altMarcada} ? ' selecionada' : '')"
               th:onclick="'document.getElementById(\'alt' + ${alt.id} + '\').checked=true;document.querySelectorAll(\'.alt-opcao\').forEach(el=>el.classList.remove(\'selecionada\'));this.classList.add(\'selecionada\')'">
            <input type="radio" name="alternativaId" th:id="'alt' + ${alt.id}"
                   th:value="${alt.id}" th:checked="${alt.id == altMarcada}"/>
            <div>
              <strong th:text="${alt.letra} + ')'"></strong>
              <span class="markdown-body" style="display:inline"
                    th:utext="${@markdownService.renderizar(alt.texto)}"></span>
            </div>
          </div>
        </div>

        <!-- Botões de navegação -->
        <div style="display:flex;justify-content:space-between;margin-top:24px;gap:10px">
          <a th:if="${questaoIdx > 0}"
             th:href="@{/prova/realizar/{id}(id=${ap.id},questao=${questaoIdx - 1})}"
             class="btn btn-ghost">
            <i class="fas fa-chevron-left"></i> Anterior
          </a>
          <div th:unless="${questaoIdx > 0}"></div>

          <div style="display:flex;gap:8px">
            <button type="submit" name="salvarApenas" class="btn btn-secondary">
              <i class="fas fa-save"></i> Salvar resposta
            </button>
            <button th:if="${questaoIdx + 1 < totalQuestoes}" type="submit" class="btn btn-primary">
              Salvar e ir para próxima <i class="fas fa-chevron-right"></i>
            </button>
            <button th:if="${questaoIdx + 1 >= totalQuestoes}" type="submit" class="btn btn-success">
              <i class="fas fa-check"></i> Salvar última resposta
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</main>

<script th:inline="javascript">
// Calcular tempo restante
const fimPermitido = /*[[${ap.calcularFimPermitido()}]]*/ null;

function atualizarTimer() {
  if (!fimPermitido) return;
  const fim = new Date(fimPermitido.toString().replace('T',' ').replace(/(\.\d+)?$/, ''));
  const agora = new Date();
  const restante = Math.max(0, Math.floor((fim - agora) / 1000));

  const min = Math.floor(restante / 60);
  const seg = restante % 60;
  const display = String(min).padStart(2,'0') + ':' + String(seg).padStart(2,'0');
  const el = document.getElementById('timer');
  el.textContent = display;

  if (restante <= 60) el.classList.add('urgente');
  else el.classList.remove('urgente');

  if (restante === 0) {
    el.textContent = '00:00';
    alert('Tempo esgotado! Sua prova será encerrada.');
    document.querySelector('form[action*="encerrar"]').submit();
    return;
  }
  setTimeout(atualizarTimer, 1000);
}

atualizarTimer();
</script>
</body>
</html>
